name: eval-gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  breakdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node eval/run.mjs
      - run: node eval/gate.mjs
